<title>경쟁점 가동률</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 고정 머리줄(신선도·검색·AI·등록) → 화면(목록 | 매장 | 상권 비교 | 등록) 한 기둥. 차트는 넓게, 표는 카드 안에서만 가로 스크롤.
   토큰·부품은 매뉴얼 대장 그대로(사내 도구끼리 같은 얼굴) + 차트 전용 토큰(비교선 8색·히트맵 7단). */
:root{
  --bg:#f1f4f2; --paper:#ffffff; --sunk:#e8eeeb; --ink:#14201b; --muted:#56655f; --line:#d5ded9;
  --accent:#126a54; --accent-ink:#ffffff; --accent-soft:#dcede6; --mark:#ffe9a6; --mark-ink:#14201b;
  --ok:#22683f; --warn:#7f5200; --bad:#b0372e; --info:#2d5c9b; --violet:#674a9e;
  --ok-bg:#e1f1e6; --warn-bg:#faedd4; --bad-bg:#f8e0dd; --info-bg:#e0e9f6; --violet-bg:#ebe4f5; --dim-bg:#e9edeb;
  --shadow:0 10px 30px rgba(18,40,32,.14);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --hdr:64px;
  --grid:#e3e9e6; --axis:#b9c5bf;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --h0:#eef4f1; --h1:#cfe6dd; --h2:#a3d3c1; --h3:#6fb9a0; --h4:#3d9a7f; --h5:#1d7a61; --h6:#0e5442;
  --bar:#126a54; --bar-soft:#9ccbb9;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101614; --paper:#18201d; --sunk:#141b18; --ink:#e3eae7; --muted:#9aa9a3; --line:#2b3632;
  --accent:#5ec4a5; --accent-ink:#0d1a15; --accent-soft:#1b332b; --mark:#5c4a10; --mark-ink:#fff4cf;
  --ok:#6cc98f; --warn:#e2a64a; --bad:#ee7c71; --info:#88b0e8; --violet:#baa2e8;
  --ok-bg:#1b3125; --warn-bg:#382b13; --bad-bg:#3b1e1b; --info-bg:#1a2a3f; --violet-bg:#2b2340; --dim-bg:#222b28;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --grid:#26302c; --axis:#3a4741;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
  --h0:#1c2622; --h1:#1d3a31; --h2:#1f5444; --h3:#237058; --h4:#2f8f71; --h5:#4fb492; --h6:#8fdcc0;
  --bar:#5ec4a5; --bar-soft:#2f6b59; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --paper:#18201d; --sunk:#141b18; --ink:#e3eae7; --muted:#9aa9a3; --line:#2b3632;
  --accent:#5ec4a5; --accent-ink:#0d1a15; --accent-soft:#1b332b; --mark:#5c4a10; --mark-ink:#fff4cf;
  --ok:#6cc98f; --warn:#e2a64a; --bad:#ee7c71; --info:#88b0e8; --violet:#baa2e8;
  --ok-bg:#1b3125; --warn-bg:#382b13; --bad-bg:#3b1e1b; --info-bg:#1a2a3f; --violet-bg:#2b2340; --dim-bg:#222b28;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --grid:#26302c; --axis:#3a4741;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
  --h0:#1c2622; --h1:#1d3a31; --h2:#1f5444; --h3:#237058; --h4:#2f8f71; --h5:#4fb492; --h6:#8fdcc0;
  --bar:#5ec4a5; --bar-soft:#2f6b59; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
mark{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:9px;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== 공용 부품: ⓘ 도움말 — 다른 도구에 이 CSS 블록과 아래 JS의 Tip 블록을 그대로 복사 ===== */
.tip-btn{display:inline-grid;place-items:center;width:20px;height:20px;margin:0 2px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--muted);font:600 12px/1 var(--f-body);cursor:help;vertical-align:middle;flex:none}
.tip-btn:hover,.tip-btn[aria-expanded="true"]{color:var(--accent);border-color:var(--accent)}
.tip-pop{position:fixed;z-index:1000;max-width:min(320px,calc(100vw - 24px));padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);font-size:13.5px;line-height:1.55;font-weight:400;text-align:left;white-space:normal}
.tip-pop[hidden]{display:none!important}
/* ===== 공용 부품 끝 ===== */

/* 머리줄 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1560px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0;border:0;background:transparent;padding:0;text-align:left;cursor:pointer}
.brand b{font-size:1.08rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand small,.fresh{color:var(--muted);font-size:.78rem;display:flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.search{flex:1 1 300px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.search:focus-within{border-color:var(--accent);background:var(--paper)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;font-size:1rem;outline:none}
.kbd{font:500 .72rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;font-size:.92rem}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:.84rem;border-radius:7px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.fill{background:var(--bad);color:var(--paper)}
.btn[disabled]{opacity:.5;cursor:default;pointer-events:none}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--muted);cursor:pointer}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:var(--paper);padding:7px 12px;font-weight:600;font-size:.86rem;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button small{font-family:var(--f-mono);font-weight:500;margin-left:4px;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:.82rem;cursor:pointer;color:var(--ink);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{font-family:var(--f-mono);margin-left:4px;opacity:.75}

.shell{max-width:1560px;margin:0 auto;padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px;min-width:0}
.block{background:var(--paper);border:1px solid var(--line);border-radius:12px;min-width:0}
.block>header{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.block>header h2{margin:0;font-size:1rem;font-weight:700;display:flex;align-items:center;gap:2px}
.block>header .sub{color:var(--muted);font-size:.84rem}
.block>header .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pad{padding:14px 16px}
.empty{padding:26px 16px;color:var(--muted);text-align:center}
.notice{font-size:.86rem;padding:9px 12px;border-radius:8px;background:var(--warn-bg);color:var(--ink);border-left:3px solid var(--warn)}
.notice.bad{background:var(--bad-bg);border-left-color:var(--bad)}
.notice.info{background:var(--info-bg);border-left-color:var(--info)}
.notice.ok{background:var(--ok-bg);border-left-color:var(--ok)}
.notice p{margin:0}.notice ul{margin:4px 0 0;padding-left:18px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:1px 9px;border-radius:999px;white-space:nowrap;line-height:1.6}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}.p-dim{background:var(--dim-bg);color:var(--muted)}
.p-info{background:var(--info-bg);color:var(--info)}
.stat{display:inline-flex;align-items:center;gap:2px}
.tag{font-size:.7rem;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}
.crumb{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--accent);text-decoration:underline}
.loading-veil{opacity:.55;transition:opacity .2s}

/* 경고 줄 */
.alerts{display:grid;gap:8px}
.alerts details summary{cursor:pointer;font-weight:600}

/* 요약 타일 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px 10px;display:grid;gap:2px;min-width:0;align-content:start}
.kpi .lb{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:2px}
.kpi .v{font-size:1.9rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.kpi .v small{font-size:.86rem;font-weight:500;color:var(--muted)}
.kpi .nt{font-size:.8rem;color:var(--muted);min-height:1.3em}
.kpi .dl{font-size:.82rem;font-weight:600;color:var(--ink)}
.kpi svg{display:block;width:100%;height:30px;margin-top:4px}

/* 목록 */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .grow{flex:1}
.grp{border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.grp-h{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:11px 16px}
.grp-h:hover{background:var(--sunk)}
.tog{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:.9rem;width:22px;padding:0}
.grp-name{font-weight:700;border:0;background:transparent;padding:0;cursor:pointer;text-align:left;color:var(--ink)}
.grp-name:hover{color:var(--accent);text-decoration:underline}
.grp-meta{font-size:.82rem;color:var(--muted);flex:1 1 220px;cursor:pointer}
.grp-own{font-size:.82rem;color:var(--muted);display:flex;gap:12px;align-items:baseline;margin-left:auto}
.grp-own b{font-size:.98rem;color:var(--ink);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:.88rem;white-space:nowrap}
table.t th{font-size:.74rem;font-weight:600;color:var(--muted);text-align:right;padding:7px 10px;background:var(--sunk);border-bottom:1px solid var(--line);position:sticky;top:0}
table.t th .h{display:inline-flex;align-items:center;gap:2px;justify-content:flex-end}
table.t th small{display:block;font-weight:500;font-family:var(--f-mono);font-size:.68rem;opacity:.85}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;z-index:1;background:inherit}
table.t thead th:first-child{background:var(--sunk);z-index:2}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;background:var(--paper)}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:var(--sunk)}
table.t tr.own td{background:var(--accent-soft)}
table.t td.l,table.t th.l{text-align:left}
.cv{font-variant-numeric:tabular-nums;font-weight:500}
.cv.b{font-weight:700}
.cs{display:block;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.na{color:var(--muted)}
.sname{font-weight:600;color:var(--ink);text-decoration:none}
.sname:hover{color:var(--accent);text-decoration:underline}
.ssub{display:block;font-size:.74rem;color:var(--muted)}
.strip{display:inline-grid;grid-template-columns:repeat(14,7px);gap:1.5px;vertical-align:middle}
.strip i{display:block;width:7px;height:14px;border-radius:1.5px}
.hatch{background:repeating-linear-gradient(45deg,var(--sunk) 0 2px,var(--line) 2px 3px)}
.ipwhy{white-space:normal;min-width:220px;max-width:420px;font-size:.82rem;color:var(--warn)}

/* 기간 바 */
.range{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.range .dates{display:flex;gap:4px;align-items:center;font-size:.84rem;color:var(--muted)}
.range input[type=date]{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font-size:.84rem}
.range .lab{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* 매장 머리 */
.shead{display:grid;gap:10px;padding:16px}
.shead h1{margin:0;font-size:1.36rem;line-height:1.3;letter-spacing:-.015em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.86rem;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:6px}

.g2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.chart{position:relative;padding:8px 12px 10px;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.ctip{position:fixed;z-index:900;pointer-events:none;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px;font-size:.82rem;line-height:1.45;max-width:min(300px,calc(100vw - 24px))}
.ctip b{font-variant-numeric:tabular-nums}
.ctip .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.ctip .sw{display:inline-block;width:14px;height:0;border-top:2.5px solid;margin-right:6px;vertical-align:middle}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:4px 16px 12px;font-size:.8rem;color:var(--muted)}
.legend .k{display:inline-flex;align-items:center;gap:5px;cursor:pointer;border:0;background:transparent;padding:2px 0;color:var(--ink)}
.legend .k[aria-pressed="false"]{opacity:.35}
.sw{display:inline-block;width:16px;height:0;border-top:2.5px solid;vertical-align:middle}
.ramp{display:flex;align-items:center;gap:4px;font-size:.74rem;color:var(--muted);padding:0 16px 12px;flex-wrap:wrap}
.ramp i{display:inline-block;width:16px;height:10px;border-radius:2px}
.memo{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem;line-height:1.65;margin:0;padding:14px 16px;max-height:420px;overflow:auto}
.heatwrap{overflow-x:auto;padding:8px 12px 4px}

/* 지도 대신 그림 */
.radar{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:16px;padding:12px 16px 16px;align-items:start}
.radar svg{width:100%;height:auto;display:block}
.radar svg text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.plist{display:grid;gap:2px;max-height:460px;overflow:auto;font-size:.86rem}
.plist .pi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px}
.plist .pi:hover{background:var(--sunk)}
.plist .pi .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .pi .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}

/* 폼 */
.form{display:grid;gap:14px;padding:16px}
.fsec{display:grid;gap:10px}
.fsec>h3{margin:0;font-size:.82rem;color:var(--muted);letter-spacing:.04em;display:flex;align-items:center;gap:2px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.fld{display:grid;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:.95rem;min-width:0;width:100%}
.fld textarea{resize:vertical;line-height:1.55}
.fld .hint{font-size:.78rem;color:var(--muted)}
.fld .err{font-size:.78rem;color:var(--bad)}
.fld.mono textarea{font-family:var(--f-mono)}
.picker{position:relative}
.plistbox{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--paper);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);max-height:300px;overflow:auto;margin-top:4px;padding:4px}
.opt{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:.9rem;color:var(--ink)}
.opt:hover,.opt[aria-selected="true"]{background:var(--accent-soft)}
.opt small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;color:var(--ink);cursor:pointer}
.chk input{margin-top:4px}
.danger-zone{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:8px}
.probe{background:var(--sunk);border-radius:10px;padding:12px 14px;display:grid;gap:4px;font-size:.88rem}
.probe b{font-size:1.1rem}

/* AI 패널 — 매뉴얼 대장 .ai 골격 */
.ai{border-color:var(--accent)}
.ai>header{background:var(--accent-soft);border-radius:12px 12px 0 0}
.ai .q{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap;border-top:1px solid var(--line)}
.ai textarea{flex:1 1 280px;min-width:0;resize:vertical;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);line-height:1.5}
.ai .sugg{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0}
.thread{display:grid;gap:14px;padding:14px 16px;max-height:min(70vh,760px);overflow:auto}
.turn-q{justify-self:end;max-width:min(560px,92%);background:var(--sunk);border-radius:12px 12px 2px 12px;padding:8px 12px;font-size:.93rem;white-space:pre-wrap;overflow-wrap:anywhere}

.nchip{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:5px;padding:0 4px;font-variant-numeric:tabular-nums;font-weight:600;font-size:.9em;line-height:1.35}

.ameta{font-size:.74rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.ai-none{padding:12px 14px;border-radius:10px;background:var(--sunk);display:grid;gap:4px}
.ai-none span{font-size:.88rem;color:var(--muted)}
.evid{max-width:860px}.evid>summary{cursor:pointer;font-size:.84rem;color:var(--accent);font-weight:600}
.evbox{margin-top:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.evt{font-size:.8rem;font-weight:600;padding:6px 10px;background:var(--sunk);border-bottom:1px solid var(--line)}
.evbox table.t{font-size:.8rem}.evbox .tw{max-height:280px;overflow:auto}

<script>
/* ===== 공용 부품: ⓘ 도움말 =====
   쓰는 법: Tip.make('설명 글', '무엇에 대한 도움말인지') → 작은 ⓘ 버튼 요소를 돌려줌.
   PC는 마우스를 올리면, 휴대폰은 탭하면 열림. 바깥을 누르거나 Esc를 누르면 닫힘. Tab으로 가면 열림.
   꼭 알아야 할 내용은 여기에 숨기지 말고 화면에 보이게 쓸 것. */
const Tip=(()=>{
  const pop=document.createElement('div');pop.className='tip-pop';pop.id='tip-pop';pop.setAttribute('role','tooltip');pop.hidden=true;
  document.body.append(pop);
  const hover=matchMedia('(hover:hover) and (pointer:fine)');
  let owner=null,pinned=false,timer=0;
  function place(btn){
    if(!btn.isConnected){close();return}
    const r=btn.getBoundingClientRect(),m=8;pop.style.left='0px';pop.style.top='0px';
    const w=pop.offsetWidth,h=pop.offsetHeight;
    let left=Math.min(Math.max(m,r.left+r.width/2-w/2),innerWidth-w-m);
    let top=r.bottom+6;if(top+h>innerHeight-m)top=Math.max(m,r.top-h-6);
    pop.style.left=left+'px';pop.style.top=top+'px';
  }
  function open(btn,pin){
    clearTimeout(timer);
    if(owner&&owner!==btn)owner.setAttribute('aria-expanded','false');
    owner=btn;pinned=!!pin;pop.textContent=btn.dataset.tip;pop.hidden=false;
    btn.setAttribute('aria-expanded','true');btn.setAttribute('aria-describedby','tip-pop');place(btn);
  }
  function close(){
    clearTimeout(timer);if(!owner)return;
    owner.setAttribute('aria-expanded','false');owner.removeAttribute('aria-describedby');owner=null;pinned=false;pop.hidden=true;
  }
  function later(){clearTimeout(timer);timer=setTimeout(()=>{if(!pinned)close()},160)}
  function make(text,label){
    const b=document.createElement('button');b.type='button';b.className='tip-btn';b.textContent='i';
    b.dataset.tip=text;b.setAttribute('aria-label','도움말: '+(label||'설명'));b.setAttribute('aria-expanded','false');
    b.addEventListener('pointerenter',()=>{if(hover.matches&&!pinned)open(b,false)});
    b.addEventListener('pointerleave',()=>{if(hover.matches)later()});
    b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(owner===b&&pinned)close();else open(b,true)});
    b.addEventListener('focus',()=>{if(owner!==b)open(b,false)});
    b.addEventListener('blur',()=>{if(!pinned)later()});
    return b;
  }
  pop.addEventListener('pointerenter',()=>clearTimeout(timer));
  pop.addEventListener('pointerleave',()=>{if(hover.matches)later()});
  document.addEventListener('pointerdown',e=>{if(owner&&!owner.contains(e.target)&&!pop.contains(e.target))close()},true);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&owner){const b=owner;close();b.focus();e.stopPropagation()}},true);
  addEventListener('scroll',()=>{if(owner)place(owner)},true);addEventListener('resize',()=>{if(owner)place(owner)});
  return {make,close,isOpen:()=>!!owner};
})();
/* ===== 공용 부품 끝 ===== */

/* ---------- 기본 도구 ---------- */
const SRV='PC 점포평가';
const $=id=>document.getElementById(id);
const el=(t,a={},...kids)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a)){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const k of kids)if(k!=null&&k!==false)e.append(k);return e};
const NS='http://www.w3.org/2000/svg';
const sv=(t,a={},...kids)=>{const e=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))if(v!=null)e.setAttribute(k,v);for(const k of kids)if(k!=null)e.append(k);return e};
const store=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const norm=s=>String(s??'').replace(/\s/g,'').toLowerCase().replace(/피시|피씨/g,'pc');
const pct=(v,d=1)=>v==null||!isFinite(v)?'—':(v*100).toFixed(d)+'%';
const pp=v=>v==null?'':(v>0?'↑':v<0?'↓':'–')+Math.abs(v*100).toFixed(1)+'%p';
const WD=['일','월','화','수','목','금','토'];
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}
function tipWrap(node,text,label){const s=el('span',{class:'stat'},node);if(text)s.append(Tip.make(text,label));return s}

/* 한국 날짜 — 서버 summary.ts와 같은 규칙(날짜는 0~24시, 이번 주는 월~일, n일은 어제까지 다 찬 n일) */
const kst=(d=new Date())=>new Date(d.getTime()+9*3600e3);
const kDate=(n=0,now=new Date())=>{const t=kst(now);t.setUTCDate(t.getUTCDate()-n);return t.toISOString().slice(0,10)};
const kHour=()=>kst().getUTCHours();
const addDays=(date,n)=>{const t=new Date(date+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const dow=d=>new Date(d+'T00:00:00Z').getUTCDay();
const daysBetween=(a,b)=>b<a?0:Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5)+1;
function thisWeek(){const t=kDate(0);const back=(dow(t)-1+7)%7;const from=addDays(t,-back);return {from,to:addDays(from,6)}}
const lastFull=n=>({from:kDate(n),to:kDate(1)});
const md=d=>d?(+d.slice(5,7))+'.'+(+d.slice(8,10)):'';
const rangeLabel=(a,b)=>a===b?md(a):md(a)+'~'+md(b);
const dLabel=d=>d.slice(5).replace('-','.')+'('+WD[dow(d)]+')';
const ago=ms=>{const m=Math.round(ms/6e4);return m<1?'방금':m<60?m+'분 전':Math.round(m/60)+'시간 전'};

/* IP대역 해석 — 서버 ipRange.ts와 같은 규칙(입력 중 바로 보여 주기용, 저장은 서버가 다시 검사) */
const MAX_IPS=1024;
function parseIpRanges(input){
  const ips=[],seen=new Set(),errors=[];
  const pIp=t=>{const p=String(t||'').trim().split('.');if(p.length!==4)return null;const n=p.map(x=>/^\d{1,3}$/.test(x)?+x:NaN);return n.every(v=>Number.isInteger(v)&&v>=0&&v<=255)?n:null};
  const num=ip=>((ip[0]<<24)>>>0)+(ip[1]<<16)+(ip[2]<<8)+ip[3];
  for(const raw of String(input||'').split(/[,;\n\r]+/)){const c=raw.trim();if(!c)continue;const [a,b]=c.split(/\s*[~\-]\s*/);const s=pIp(a);
    if(!s){errors.push('"'+c+'" — IP 모양이 아닙니다.');continue}let e=num(s);
    if(b!=null&&b!==''){const end=/^\d{1,3}$/.test(b)?[s[0],s[1],s[2],+b]:pIp(b);if(!end||end[3]>255){errors.push('"'+c+'" — 끝 IP를 읽지 못했습니다.');continue}e=num(end)}
    const sn=num(s);if(e<sn){errors.push('"'+c+'" — 끝이 시작보다 작습니다.');continue}
    if(e-sn+1>MAX_IPS){errors.push('"'+c+'" — 한 매장에 IP '+MAX_IPS+'개까지만 됩니다.');continue}
    for(let n=sn;n<=e;n++){if(seen.has(n))continue;seen.add(n);ips.push(n)}}
  if(ips.length>MAX_IPS)errors.push('IP가 모두 '+ips.length+'개입니다 — 한 매장에 '+MAX_IPS+'개까지만 됩니다.');
  return {count:ips.length,errors};
}

/* ---------- 연결 도구(커넥터) ---------- */
let mcp=null,sample=null,downloads=null,ready=false;
const READ_CACHE={staleTime:10*60e3,gcTime:24*3600e3};
const ERRMSG={
  server_not_connected:['「PC 점포평가」 연결이 없습니다.','claude.ai 설정 → 커넥터에서 「PC 점포평가」를 연결(회사 계정으로 로그인)한 뒤 이 페이지를 다시 여세요.'],
  selection_required:['「PC 점포평가」 연결을 하나 골라야 합니다.','화면에 뜬 선택 창에서 연결을 골라 주세요.'],
  server_not_found:['「PC 점포평가」 연결을 찾지 못했습니다.','claude.ai 설정 → 커넥터에서 연결 이름을 확인해 주세요.'],
  needs_reauth:['「PC 점포평가」 로그인이 끝났습니다.','claude.ai 설정 → 커넥터에서 다시 로그인한 뒤 새로 불러오세요.'],
  not_granted:['이 페이지가 「PC 점포평가」를 쓰도록 허용되지 않았습니다.','페이지 위 권한 안내에서 허용한 뒤 새로 불러오세요.'],
  consent_required:['「PC 점포평가」 사용 허용이 필요합니다.','허용 창에서 허용한 뒤 새로 불러오세요.'],
  approval_required:['「PC 점포평가」 사용 허용이 필요합니다.','허용 창에서 허용한 뒤 다시 눌러 주세요.'],
  blocked_by_policy:['조직 설정으로 이 연결을 쓸 수 없습니다.','관리자에게 문의해 주세요.'],
  rate_limited:['요청이 몰려 있습니다.','잠시 뒤 새로 불러오세요.'],
  server_unavailable:['측정기 서버가 잠깐 응답하지 않습니다.','잠시 뒤 새로 불러오세요.'],
  upstream_error:['측정기 서버가 잠깐 응답하지 않습니다.','잠시 뒤 새로 불러오세요.'],
  capability_disabled:['이 화면에서는 연결 도구를 쓸 수 없습니다.','claude.ai에서 이 페이지를 열어 주세요.'],
};
const NOCONN=new Set(['server_not_connected','selection_required','server_not_found','needs_reauth','not_granted','consent_required','approval_required','blocked_by_policy','capability_disabled']);
function errText(e){
  if(!e)return ['자료를 불러오지 못했습니다.',''];
  if(e.code==='tool_error'){const p=e.result&&(e.result.payload||e.result.structuredContent);const m=(p&&p.error)||(e.result&&e.result.content&&e.result.content[0]&&e.result.content[0].text)||e.message;return [String(m||'측정기 서버가 처리하지 못했습니다.'),'']}
  return ERRMSG[e.code]||['자료를 불러오지 못했습니다.',e.code?'('+e.code+')':''];
}
async function call(tool,input,opt={}){
  if(!mcp)throw {code:'capability_disabled'};
  const r=await mcp.callTool(SRV,tool,input||{},opt.fresh?{cache:{...READ_CACHE,refresh:true}}:opt.cache===false?{cache:false}:opt.read?{cache:READ_CACHE}:undefined);
  return {data:r.payload,storedAt:r.cache?r.cache.storedAt:Date.now()};
}
/* 화면 자료는 watchTool로 — 저장된 값을 먼저 보여 주고 낡았으면 새로 받는다(반복 조회 없음: 측정이 매시 한 번이라). */
function watch(tool,input,onData,onErr){
  if(!mcp){onErr({code:'capability_disabled'});return ()=>{}}
  try{return mcp.watchTool(SRV,tool,input||{},ev=>{if(ev.type==='data')onData(ev.result.payload,ev.result.cache?ev.result.cache.storedAt:Date.now(),ev.result.cache&&ev.result.cache.revalidating);else onErr(ev.error)},{cache:READ_CACHE})}
  catch(e){onErr(e);return ()=>{}}
}
async function refreshAll(){
  try{if(mcp&&mcp.invalidate){await mcp.invalidate(SRV);return}}catch(e){}
  try{const r=await call('ping_overview',{},{fresh:true});setOverview(r.data,r.storedAt)}catch(e){ovErr(e)}
}

/* ---------- 상태 ---------- */
const S={ov:null,ovAt:0,ovErr:null,route:{v:'list'},tab:store('pm-tab')||'existing',filter:'all',open:new Set(),prefill:null};
const sel={};

function setOverview(d,at){S.ov=d;S.ovAt=at||Date.now();S.ovErr=null;renderFresh();if(['list','ip'].includes(S.route.v))render()}
function ovErr(e){S.ovErr=e;renderFresh();if(['list','ip'].includes(S.route.v))render();renderBanner()}

function renderFresh(){
  const d=$('freshDot'),t=$('freshTxt');
  if(S.ovErr&&!S.ov){d.className='dot bad';t.textContent=NOCONN.has(S.ovErr.code)?'연결 필요':'불러오지 못함';return}
  if(!S.ov){d.className='dot';t.textContent='불러오는 중';return}
  const last=S.ov.lastRoundAt?new Date(S.ov.lastRoundAt):null;const gap=last?Date.now()-last:Infinity;
  d.className='dot '+(gap<=75*6e4?'ok':gap<=3*3600e3?'warn':'bad');
  const hm=last?kst(last).toISOString().slice(11,16):'—';
  t.textContent='마지막 측정 '+hm+' · '+ago(Date.now()-S.ovAt)+' 불러옴';
}
setInterval(renderFresh,60e3);

function renderBanner(){
  const b=$('banner');b.textContent='';
  const e=S.ovErr;if(!e||!NOCONN.has(e.code))return;
  const [m,sub]=errText(e);
  b.append(el('div',{class:'notice info'},el('p',{},el('b',{text:m}),' '+sub),el('p',{style:'margin-top:4px;color:var(--muted)',text:'이 페이지는 측정 자료를 「PC 점포평가」 연결(회사 계정)로 불러옵니다. 연결 전에는 숫자 대신 —가 보이고, 등록·고치기·지금 확인은 쓸 수 없습니다.'})));
}

/* ---------- 경로(주소창 #) ---------- */
const hexOf=s=>[...new TextEncoder().encode(s)].map(b=>b.toString(16).padStart(2,'0')).join('');
const unhex=h=>{try{return new TextDecoder().decode(new Uint8Array(h.match(/../g).map(x=>parseInt(x,16))))}catch(e){return ''}};
const codeKey=c=>/^[A-Za-z0-9]+$/.test(c)?'a-'+c:'a-x'+hexOf(c);
const keyCode=k=>k.startsWith('x')?unhex(k.slice(1)):k;
const go=h=>{if(location.hash==='#'+h)route();else location.hash=h};
const storeHref=id=>/^[A-Za-z0-9_-]+$/.test(id)?'#s-'+id:'#';
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  let r={v:'list'};
  if(h==='ip')r={v:'ip'};else if(h==='new')r={v:'new'};
  else if(h.startsWith('s-'))r={v:'store',id:h.slice(2)};
  else if(h.startsWith('a-'))r={v:'area',code:keyCode(h.slice(2))};
  else if(h.startsWith('tab-')&&['existing','candidate','all'].includes(h.slice(4))){r={v:'list'};S.tab=h.slice(4)}
  S.route=r;cleanup();render();window.scrollTo({top:0});
}
addEventListener('hashchange',route);
let unsubs=[];const cleanup=()=>{unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];hideTip()};

/* ---------- 차트 공용 ---------- */
const ctip=$('ctip');
function showTip(x,y,node){ctip.textContent='';ctip.append(node);ctip.hidden=false;const w=ctip.offsetWidth,h=ctip.offsetHeight;let l=x+14,t=y+14;if(l+w>innerWidth-8)l=x-w-14;if(t+h>innerHeight-8)t=y-h-14;ctip.style.left=Math.max(8,l)+'px';ctip.style.top=Math.max(8,t)+'px'}
function hideTip(){ctip.hidden=true}
const ramp=v=>v==null?null:'var(--h'+(v<.1?0:v<.25?1:v<.4?2:v<.55?3:v<.7?4:v<.85?5:6)+')';
function rampLegend(){const r=el('div',{class:'ramp'},el('span',{text:'0%'}));for(let i=0;i<7;i++)r.append(el('i',{style:'background:var(--h'+i+')'}));r.append(el('span',{text:'85%+'}),el('i',{class:'hatch',style:'margin-left:10px'}),el('span',{text:'측정 없음'}));return r}
function sizeOf(box){return Math.max(280,Math.floor(box.clientWidth||box.parentElement?.clientWidth||600))}
/* 그릴 때 폭을 재고, 폭이 바뀌면 다시 그림 */
function responsive(box,draw){let w=0;const ro=new ResizeObserver(()=>{const nw=sizeOf(box);if(Math.abs(nw-w)>8){w=nw;box.textContent='';draw(w)}});ro.observe(box);unsubs.push(()=>ro.disconnect())}

/* 막대 — Y 0~100% 고정. bars:[{label,value,detail,faint,empty,hl,prev}] */
function barChart(box,bars,{h=190,tickEvery=1,onPick,ariaLabel}={}){
  responsive(box,W=>{
    const L=34,R=6,T=10,B=24,iw=W-L-R,ih=h-T-B,n=Math.max(1,bars.length),bw=iw/n,gap=Math.min(4,bw*.25);
    const s=sv('svg',{viewBox:`0 0 ${W} ${h}`,height:h,role:'img','aria-label':ariaLabel||'막대 그래프',tabindex:'0'});
    [0,.25,.5,.75,1].forEach(g=>{const y=T+ih*(1-g);s.append(sv('line',{x1:L,x2:W-R,y1:y,y2:y,style:'stroke:var(--grid)'}));if(g%.5===0)s.append(sv('text',{x:L-6,y:y+4,'text-anchor':'end'},String(g*100)+'%'))});
    s.append(sv('line',{x1:L,x2:W-R,y1:T+ih,y2:T+ih,style:'stroke:var(--axis)'}));
    bars.forEach((b,i)=>{const x=L+i*bw+gap/2,w=Math.max(1,bw-gap);
      if(b.prev!=null){const ph=ih*Math.min(1,b.prev);s.append(sv('rect',{x,y:T+ih-ph,width:w,height:ph,rx:2,style:'fill:none;stroke:var(--muted);stroke-dasharray:3 2;stroke-width:1'}))}
      if(b.value==null){if(b.empty)s.append(sv('rect',{x,y:T,width:w,height:ih,rx:2,style:'fill:none;stroke:var(--line);stroke-dasharray:2 3'}))}
      else{const bh=Math.max(1.5,ih*Math.min(1,b.value));s.append(sv('rect',{x,y:T+ih-bh,width:w,height:bh,rx:Math.min(3,w/3),style:'fill:'+(b.hl?'var(--accent)':b.faint?'var(--bar-soft)':'var(--bar)')}))}
      if(i%tickEvery===0)s.append(sv('text',{x:x+w/2,y:h-6,'text-anchor':'middle',style:b.weekend?'fill:var(--ink)':null},b.label));
    });
    const hit=sv('rect',{x:L,y:T,width:iw,height:ih,style:'fill:transparent;cursor:'+(onPick?'pointer':'default')});s.append(hit);
    let cur=-1;const tipAt=(i,x,y)=>{cur=i;const b=bars[i];if(!b)return;showTip(x,y,el('div',{},el('div',{},el('b',{text:b.value==null?'—':pct(b.value)}),' · '+b.label),b.detail?el('div',{style:'color:var(--muted)',text:b.detail}):null))};
    hit.addEventListener('pointermove',e=>{const r=s.getBoundingClientRect();tipAt(Math.max(0,Math.min(n-1,Math.floor((e.clientX-r.left)*(W/r.width)-L)/bw|0)),e.clientX,e.clientY)});
    hit.addEventListener('pointerleave',hideTip);
    if(onPick)hit.addEventListener('click',e=>{const r=s.getBoundingClientRect();const i=Math.floor(((e.clientX-r.left)*(W/r.width)-L)/bw);if(bars[i])onPick(bars[i],i)});
    s.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();cur=Math.max(0,Math.min(n-1,cur+(e.key==='ArrowRight'?1:-1)));const r=s.getBoundingClientRect();tipAt(cur,r.left+(L+cur*bw+bw/2)*(r.width/W),r.top+20)});
    s.addEventListener('blur',hideTip);
    box.append(s);
  });
}

/* 여러 선 — series:[{key,label,color,dash,width,values}], 세로 십자선 위치의 모든 값 */
function lineChart(box,series,xLabels,{h=230,tickEvery=1,hl=()=>null,ariaLabel}={}){
  const api={redraw:null};
  responsive(box,W=>{
    const L=34,R=10,T=10,B=24,iw=W-L-R,ih=h-T-B,n=xLabels.length,step=n>1?iw/(n-1):0;
    const X=i=>L+(n>1?i*step:iw/2),Y=v=>T+ih*(1-Math.min(1,v));
    const s=sv('svg',{viewBox:`0 0 ${W} ${h}`,height:h,role:'img','aria-label':ariaLabel||'선 그래프',tabindex:'0'});
    [0,.25,.5,.75,1].forEach(g=>{const y=T+ih*(1-g);s.append(sv('line',{x1:L,x2:W-R,y1:y,y2:y,style:'stroke:var(--grid)'}));if(g%.5===0)s.append(sv('text',{x:L-6,y:y+4,'text-anchor':'end'},String(g*100)+'%'))});
    xLabels.forEach((t,i)=>{if(i%tickEvery===0)s.append(sv('text',{x:X(i),y:h-6,'text-anchor':'middle'},t))});
    const lines=sv('g');s.append(lines);
    const draw=()=>{lines.textContent='';const k=hl();
      series.forEach(se=>{const on=!k||k===se.key;let d='',pen=false;const pts=[];
        se.values.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1);pen=true;pts.push(i)});
        const st='fill:none;stroke:'+se.color+';stroke-width:'+((se.width||2)+(k===se.key?1:0))+';stroke-linejoin:round;stroke-linecap:round;opacity:'+(on?1:.18)+(se.dash?';stroke-dasharray:5 4':'');
        lines.append(sv('path',{d,style:st}));
        // 끊긴 점(앞뒤가 비어 있는 한 칸)도 보이게
        se.values.forEach((v,i)=>{if(v!=null&&(i===0||se.values[i-1]==null)&&(i===n-1||se.values[i+1]==null))lines.append(sv('circle',{cx:X(i),cy:Y(v),r:2.6,style:'fill:'+se.color+';opacity:'+(on?1:.18)}))});
      })};
    draw();api.redraw=draw;
    const cross=sv('line',{y1:T,y2:T+ih,style:'stroke:var(--axis);display:none'});s.append(cross);
    const hit=sv('rect',{x:L,y:T,width:iw,height:ih,style:'fill:transparent'});s.append(hit);
    let cur=-1;const tipAt=(i,x,y)=>{cur=i;cross.setAttribute('x1',X(i));cross.setAttribute('x2',X(i));cross.style.display='';
      const rows=series.map(se=>({se,v:se.values[i]})).filter(r=>r.v!=null).sort((a,b)=>b.v-a.v);
      const box2=el('div',{},el('div',{style:'font-weight:600;margin-bottom:2px',text:xLabels[i]}));
      if(!rows.length)box2.append(el('div',{style:'color:var(--muted)',text:'값 없음'}));
      rows.forEach(r=>box2.append(el('div',{class:'row'},el('span',{},el('span',{class:'sw',style:'border-color:'+r.se.color+(r.se.dash?';border-top-style:dashed':'')}),r.se.label),el('b',{text:pct(r.v)}))));
      showTip(x,y,box2)};
    const idx=e=>{const r=s.getBoundingClientRect();return Math.max(0,Math.min(n-1,Math.round(((e.clientX-r.left)*(W/r.width)-L)/(step||1))))};
    hit.addEventListener('pointermove',e=>tipAt(idx(e),e.clientX,e.clientY));
    hit.addEventListener('pointerleave',()=>{hideTip();cross.style.display='none'});
    s.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();cur=Math.max(0,Math.min(n-1,cur+(e.key==='ArrowRight'?1:-1)));const r=s.getBoundingClientRect();tipAt(cur,r.left+X(cur)*(r.width/W),r.top+20)});
    s.addEventListener('blur',()=>{hideTip();cross.style.display='none'});
    box.append(s);
  });
  return api;
}

/* 칸표 — rows:[{label,bold,values[24],detail(i)}], 열은 0~23시 */
function heatGrid(box,rows,{cols=24,colLabel=i=>String(i),labelW=64,cell=18,tip}={}){
  const W=labelW+cols*(cell+2)+4,H=18+rows.length*(cell+2)+2;
  const s=sv('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,role:'img','aria-label':'시간대별 칸표',style:'max-width:none'});
  for(let c=0;c<cols;c++)if(c%3===0)s.append(sv('text',{x:labelW+c*(cell+2)+cell/2,y:11,'text-anchor':'middle'},colLabel(c)));
  rows.forEach((r,ri)=>{const y=18+ri*(cell+2);
    s.append(sv('text',{x:labelW-6,y:y+cell/2+4,'text-anchor':'end',style:r.bold?'fill:var(--ink);font-weight:600':null},r.label.length>9?r.label.slice(0,9)+'…':r.label));
    r.values.forEach((v,c)=>{const x=labelW+c*(cell+2);
      const rc=sv('rect',{x,y,width:cell,height:cell,rx:3,style:v==null?'fill:var(--sunk);stroke:var(--line);stroke-dasharray:2 2':'fill:'+ramp(v)});
      rc.addEventListener('pointerenter',e=>showTip(e.clientX,e.clientY,el('div',{},el('b',{text:v==null?'측정 없음':pct(v)}),' · '+(tip?tip(r,c):r.label+' '+colLabel(c)))));
      rc.addEventListener('pointermove',e=>showTip(e.clientX,e.clientY,ctip.firstChild||el('span')));
      rc.addEventListener('pointerleave',hideTip);
      s.append(rc)})});
  box.append(s);
}

/* 1km 거리 그림 — 지도 대신(외부 지도는 이 페이지에서 못 띄움). center 기준 동·북 미터 */
function radar(box,center,points,{onPick}={}){
  const S0=420,R=S0/2-26,cx=S0/2,cy=S0/2,M=1000;
  const s=sv('svg',{viewBox:`0 0 ${S0} ${S0}`,role:'img','aria-label':'반경 1km 거리 그림'});
  s.append(sv('circle',{cx,cy,r:R*500/M,style:'fill:var(--accent-soft);stroke:none'}));
  [250,500,750,1000].forEach(m=>{s.append(sv('circle',{cx,cy,r:R*m/M,style:'fill:none;stroke:var(--grid)'}));s.append(sv('text',{x:cx+4,y:cy-R*m/M+11},m===1000?'1km':m+'m'))});
  s.append(sv('text',{x:cx,y:12,'text-anchor':'middle',style:'fill:var(--ink);font-weight:600'},'북'));
  const xy=p=>{const dx=(p.lng-center.lng)*Math.cos(center.lat*Math.PI/180)*111320,dy=(p.lat-center.lat)*110540;return [cx+dx/M*R,cy-dy/M*R]};
  points.forEach(p=>{if(p.lat==null||p.lng==null)return;const [x,y]=xy(p);if(Math.hypot(x-cx,y-cy)>R+14)return;
    const g=sv('g',{style:'cursor:'+(onPick&&!p.reg?'pointer':'default')});
    if(p.kind==='own')g.append(sv('path',{d:`M${x},${y-8}l2.4,5 5.4.6-4,3.7 1,5.4-4.8-2.6-4.8,2.6 1-5.4-4-3.7 5.4-.6z`,style:'fill:var(--ink)'}));
    else if(p.reg)g.append(sv('circle',{cx:x,cy:y,r:5.5,style:'fill:'+(p.color||'var(--accent)')+';stroke:var(--paper);stroke-width:1.5'}));
    else g.append(sv('circle',{cx:x,cy:y,r:4.5,style:'fill:var(--paper);stroke:var(--muted);stroke-width:1.5'}));
    if(p.label)g.append(sv('text',{x:x+8,y:y+3.5,style:p.kind==='own'?'fill:var(--ink);font-weight:600':null},p.label.length>10?p.label.slice(0,10)+'…':p.label));
    g.append(sv('circle',{cx:x,cy:y,r:12,style:'fill:transparent'}));
    g.addEventListener('pointerenter',e=>showTip(e.clientX,e.clientY,el('div',{},el('b',{text:p.name}),el('div',{style:'color:var(--muted)',text:[p.dist!=null?p.dist+'m':'',p.reg?'측정기 등록'+(p.note?' · '+p.note:''):p.kind==='own'?'기준':'측정기 미등록 — 누르면 등록'].filter(Boolean).join(' · ')}))));
    g.addEventListener('pointerleave',hideTip);
    if(onPick&&!p.reg&&p.kind!=='own')g.addEventListener('click',()=>onPick(p));
    s.append(g)});
  box.append(s);
}

/* ---------- 공용 조각 ---------- */
const TONE={ok:'p-ok',warn:'p-warn',danger:'p-bad',neutral:'p-dim'};
function statusPill(st){const p=el('span',{class:'pill '+(TONE[st.tone]||'p-dim'),text:st.label});return tipWrap(p,st.hint,st.label)}
function cellPct(c,{bold,expect,today}={}){
  if(!c||c.util==null)return el('td',{},el('span',{class:'na',text:'—'}));
  const note=today?(c.samples&&c.samples<24?c.samples+'시간치':''):(c.days>0&&expect&&c.days<expect?c.days+'일치':'');
  return el('td',{},el('span',{class:'cv'+(bold?' b':''),text:pct(c.util)}),el('span',{class:'cs',text:[c.avgOn!=null?'≈'+Math.round(c.avgOn)+'대':'',note].filter(Boolean).join(' · ')}));
}
function strip(spark){const g=el('span',{class:'strip','aria-hidden':'true'});(spark||Array(14).fill(null)).forEach(v=>g.append(el('i',{class:v==null?'hatch':null,style:v==null?null:'background:'+ramp(v)})));return g}
function sparkSvg(vals){const s=sv('svg',{viewBox:'0 0 100 30',preserveAspectRatio:'none','aria-hidden':'true'});const pts=vals.map((v,i)=>v==null?null:[i/(Math.max(1,vals.length-1))*100,28-26*Math.min(1,v)]).filter(Boolean);if(pts.length<2)return s;
  s.append(sv('path',{d:'M'+pts.map(p=>p.join(',')).join('L')+`L${pts.at(-1)[0]},30L${pts[0][0]},30Z`,style:'fill:var(--accent-soft);stroke:none'}),sv('path',{d:'M'+pts.map(p=>p.join(',')).join('L'),style:'fill:none;stroke:var(--accent);stroke-width:1.6;vector-effect:non-scaling-stroke'}),sv('circle',{cx:pts.at(-1)[0],cy:pts.at(-1)[1],r:2.2,style:'fill:var(--accent)'}));return s}
function kpi(label,tip,value,unit,note,{delta,spark}={}){
  const lb=el('div',{class:'lb'},label);if(tip)lb.append(Tip.make(tip,label));
  const v=el('div',{class:'v'},value,unit?el('small',{text:unit}):null,delta?el('span',{class:'dl',text:delta}):null);

}
const mean=a=>{const v=a.filter(x=>x!=null&&isFinite(x));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
async function saveCsv(name,rows){
  const txt='﻿'+rows.map(r=>r.map(c=>{const s=c==null?'':String(c);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\r\n');
  if(!downloads){toast('이 화면에서는 파일 받기를 쓸 수 없습니다.');return}
  try{await downloads.save({filename:name,data:txt});}catch(e){if(e&&e.code!=='cancelled'&&e.code!=='declined')toast('파일을 받지 못했습니다.')}
}
function loadingBlock(text){return el('div',{class:'block empty'},el('span',{class:'spin','aria-hidden':'true',style:'vertical-align:-2px;margin-right:8px'}),text)}

/* ---------- 화면 1: 목록 ---------- */
const isCand=code=>/^N\d+$/.test(code)||String(code).startsWith('직접후보:');
function needsCheck(r){return r.status.tone!=='ok'&&r.status.tone!=='neutral'&&r.status.label!=='IP 미등록'}
function renderList(v){
  const o=S.ov;
  if(!o){v.append(S.ovErr?errBlock(S.ovErr,refreshAll):loadingBlock('측정 중인 매장 자료를 불러오는 중입니다'));return}
  const R=o.ranges,q=norm($('q').value);
  const stores=o.stores,rivals=stores.filter(s=>!s.isOwnStore);
  const byOwn=new Map();for(const s of stores){if(!s.ownCode)continue;if(!byOwn.has(s.ownCode))byOwn.set(s.ownCode,{own:null,rivals:[]});const g=byOwn.get(s.ownCode);if(s.isOwnStore)g.own=s;else g.rivals.push(s)}
  const groups=o.groups.map(g=>({...g,...(byOwn.get(g.code)||{own:null,rivals:[]})}));
  const gEx=groups.filter(g=>g.kind==='existing'),gCa=groups.filter(g=>g.kind==='candidate');
  const ipRows=stores.filter(needsCheck).sort((a,b)=>String(a.ownName).localeCompare(String(b.ownName),'ko'));

  // 경고
  const al=el('div',{class:'alerts'});
  const last=o.lastRoundAt?new Date(o.lastRoundAt):null;
  if(last&&Date.now()-last>3*3600e3)al.append(el('div',{class:'notice bad'},el('p',{},el('b',{text:'서버 측정이 멈춘 것 같습니다'}),' — 마지막 측정 '+kst(last).toISOString().slice(5,16).replace('T',' ')+'. 매시 5분쯤 측정합니다.')));
  if(o.missedHours.length){const ok=24-o.missedHours.length>=o.rules.recentMinHours;al.append(el('div',{class:'notice'},el('p',{},'최근 24시간 중 ',el('b',{text:o.missedHours.map(h=>h+'시').join('·')}),' 회차가 측정 안 됐습니다. '+(ok?'「24시간」 값은 나머지 '+(24-o.missedHours.length)+'시간 기준입니다.':'「24시간」은 '+o.rules.recentMinHours+'시간 이상 차야 값이 나와, 빠진 회차가 24시간 밖으로 밀려날 때까지 비어 있습니다.'))))}
  if(o.overlaps.length){const d=el('details',{class:'notice bad'},el('summary',{text:'겹치는 등록 '+o.overlaps.length+'건 — 같은 매장이 두 번 들어갔거나 IP·주소가 잘못 들어간 곳'}));const ul=el('ul');
    o.overlaps.forEach(x=>ul.append(el('li',{},(x.kind==='ip'?'IP '+x.overlap+'개 겹침':x.kind==='address'?'주소 같음':'같은 건물 · 한쪽 층·호수 없음')+': ',el('a',{href:storeHref(x.a.id),text:x.a.name}),' ('+(x.a.own||'묶음 없음')+') ↔ ',el('a',{href:storeHref(x.b.id),text:x.b.name}),' ('+(x.b.own||'묶음 없음')+')')));
    d.append(ul,el('p',{style:'margin-top:6px',text:'매장을 눌러 잘못된 쪽의 IP·주소를 고치거나, 같은 매장이면 하나를 측정 중지하세요. 같은 건물의 다른 PC방이면 두 주소에 층·호수를 적으면 이 목록에서 빠집니다.'}));al.append(d)}
  if(al.childNodes.length)v.append(al);

  // 요약 타일(지금 탭 범위)
  const scope=tab==='existing'?gEx.flatMap(g=>g.rivals):tab==='candidate'?gCa.flatMap(g=>g.rivals):tab==='ip'?ipRows:rivals;
  const meas=scope.filter(s=>s.status.kind==='measuring'),shows=scope.filter(s=>s.status.showsValues&&s.live);
  const liveAvg=mean(shows.map(s=>s.live.util)),aliveSum=shows.reduce((n,s)=>n+(s.live.alive||0),0);
  const both=scope.filter(s=>s.thisWeek&&s.thisWeek.util!=null&&s.lastWeek&&s.lastWeek.util!=null);
  const tw=mean(both.map(s=>s.thisWeek.util)),lw=mean(both.map(s=>s.lastWeek.util));
  const sparkAvg=Array.from({length:14},(_,i)=>mean(scope.map(s=>s.spark?s.spark[i]:null)));
  const lastHour=shows[0]?.live?.hour;
  v.append(el('div',{class:'kpis'},

const RULES=['너는 아이센스 PC가맹 개발팀의 「경쟁점 가동률 측정기」 도우미다. 한국어 존댓말로, 쉬운 말로 답한다.',

const SUGG={list:['이번 주 가장 바쁜 경쟁점은?','IP를 다시 확인해야 할 매장은 어디인가요?','신규후보지 경쟁점 중 지난주보다 많이 떨어진 곳은?'],store:['지난 기간보다 가동률이 왜 바뀌었나요?','이 매장은 언제 가장 붐비나요?','측정이 빠지거나 이상한 날이 있나요?'],area:['이 상권에서 가장 바쁜 경쟁점은?','우리 매장과 경쟁점의 바쁜 시간대가 겹치나요?','평일과 주말 차이가 큰 매장은?']};
function openAI(q,kind){AI.open=true;AI.scope=kind||null;renderAI();const ta=$('aiq');if(ta){if(q)ta.value=q;ta.focus({preventScroll:true})}const y=$('ai').getBoundingClientRect().top+scrollY-$('hdr').offsetHeight-12;scrollTo({top:Math.max(0,y)})}
function fmtAnswer(text){
  const box=el('div',{class:'turn-a'});let ul=null;
  const inline=(line,node)=>{const re=/(\*\*[^*]+\*\*)|(\d{1,3}(?:\.\d+)?\s?%)/g;let last=0,m;while((m=re.exec(line))){node.append(line.slice(last,m.index));if(m[1])node.append(el('b',{text:m[1].slice(2,-2)}));else{const v=parseFloat(m[2]);const ok=[...seen].some(x=>Math.abs(x-v)<=1);node.append(el('span',{class:'nchip'+(ok?'':' unv'),title:ok?'불러온 자료와 맞음':'불러온 자료와 대조 안 됨',text:m[2].replace(/\s/,'')}))}last=m.index+m[0].length}node.append(line.slice(last));return node};
  String(text).split(/\n/).forEach(raw=>{const line=raw.replace(/^#+\s*/,'');if(!line.trim()){ul=null;return}
    const li=line.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)$/);if(li){if(!ul){ul=el('ul');box.append(ul)}ul.append(inline(li[1],el('li')))}else{ul=null;box.append(inline(line,el('p')))}});
  return box;
}

    d.append(el('div',{class:'evbox'},el('div',{class:'evt',text:x.title}),el('div',{class:'tw'},t)))});

}
function renderAI(){
  const box=$('ai');box.hidden=!AI.open;box.textContent='';if(!AI.open)return;
  const h=el('h2',{},'AI에게 묻기');h.append(Tip.make('AI가 이 페이지의 측정 자료(목록·매장 날짜별·시간대별·상권 비교)를 직접 찾아보고 답합니다. 답 속 % 숫자 중 테두리 진한 것은 불러온 자료와 맞는 값(±1%p), 회색은 대조가 안 된 값입니다. 답 아래 「AI가 본 자료」를 펼치면 AI가 실제로 불러온 숫자 표를 그대로 볼 수 있습니다. 답은 Claude Sonnet 5.5가 씁니다(못 쓰는 때는 기본 등급으로 넘어가며 답 아래에 표시). 질문할 때만 보는 사람 본인의 Claude 사용량이 쓰입니다.','AI에게 묻기'));
  const scopeTxt=S.route.v==='store'&&sel.store?'범위: '+sel.store.store.name+' · '+rangeLabel(sel.store.period.from,sel.store.period.to):S.route.v==='area'&&sel.area?'범위: '+sel.area.ownName+' 상권':'측정 자료만 근거로 답합니다';
  box.append(el('header',{},h,el('span',{class:'sub',text:scopeTxt}),el('div',{class:'right'},AI.turns.length?el('button',{class:'btn sm',type:'button',onclick:()=>{if(AI.ctl)AI.ctl.abort();AI.turns=[];renderAI()}},'새 대화'):null,el('button',{class:'btn sm',type:'button',onclick:()=>{if(AI.ctl)AI.ctl.abort();AI.open=false;renderAI()}},'닫기'))));
  const th=el('div',{class:'thread',id:'aithread','aria-live':'polite'});
  AI.turns.forEach(t=>{th.append(el('div',{class:'turn-q',text:t.q}));
    if(t.steps.length)th.append(el('div',{class:'steps'},...t.steps.map((s,i)=>el('div',{class:'s'+(t.busy&&i===t.steps.length-1?' run':''),text:s}))));
    if(t.error)th.append(el('div',{class:'ai-none'},el('b',{text:t.error[0]}),t.error[1]?el('span',{text:t.error[1]}):null));
    else if(t.text)th.append(fmtAnswer(t.text),t.busy?null:el('div',{class:'ameta'},t.truncated?el('span',{text:'답이 길어 중간에 끊겼습니다 — 범위를 좁혀 다시 물어보세요.'}):null,t.model?el('span',{text:'답한 모델: '+t.model}):t.model===null?el('span',{text:AI_MODEL_NAME.replace('Claude ','')+'를 쓸 수 없어 기본 등급으로 답함'}):null),t.busy||!t.ev.length?null:evidenceBlock(t.ev));

  const goB=el('button',{class:'btn pri',type:'button',onclick:ask,disabled:AI.busy||null},AI.busy?'답 쓰는 중':'묻기');
  const stop=AI.busy?el('button',{class:'btn',type:'button',onclick:()=>AI.ctl&&AI.ctl.abort()},'멈춤'):null;
  box.append(el('div',{class:'q'},ta,goB,stop));
  th.scrollTop=th.scrollHeight;

async function ask(){
  const ta=$('aiq');const q=(ta&&ta.value.trim())||'';if(!q||AI.busy)return;
  const t={q,steps:[],text:'',busy:true,error:null,truncated:false,ev:[],model:undefined};AI.turns.push(t);AI.busy=true;AI.ctl=new AbortController();renderAI();
  if(!sample){t.busy=false;AI.busy=false;t.error=['이 화면에서는 AI를 쓸 수 없습니다.','claude.ai에서 이 페이지를 열어 주세요.'];renderAI();return}
  const step=s=>{t.steps.push(s);renderAI()};
  const hist=[];const past=AI.turns.slice(0,-1).filter(x=>x.text&&!x.error).slice(-4);
  hist.push({role:'user',content:RULES+'\n\n[지금 화면]\n'+screenContext()+'\n\n[질문]\n'+(past.length?past[0].q:q)});
  past.forEach((x,i)=>{hist.push({role:'assistant',content:x.text});hist.push({role:'user',content:i+1<past.length?past[i+1].q:'[지금 화면]\n'+screenContext()+'\n\n[질문]\n'+q})});
  try{
    let raf=0;
    const res=await sample(hist,{model:AI_MODEL,modelTier:'default',tools:aiTools(step,x=>t.ev.push(x)),signal:AI.ctl.signal,cache:false,onText:({text})=>{t.text=text;cancelAnimationFrame(raf);raf=requestAnimationFrame(renderAI)}});
    t.text=res.text;t.truncated=!!res.truncated;t.model=res.modelApplied===AI_MODEL?AI_MODEL_NAME:null;
  }catch(e){const c=e&&e.code;if(c==='cancelled'){if(!t.text)t.error=['멈췄습니다.','']}else{const m=ERR[c]||['AI 연결이 잠깐 끊겼습니다.','다시 물어봐 주세요.'];if(e&&e.text)t.text=e.text;else t.error=m}}
  finally{t.busy=false;AI.busy=false;AI.ctl=null;renderAI();const a=$('aiq');if(a){a.value='';a.focus({preventScroll:true})}}
}
