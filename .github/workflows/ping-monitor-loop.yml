# 경쟁점 가동률 측정기 — 예비 "계속 도는" 알람(2026-10-08 밤).
# 매시 예약(ping-monitor.yml)은 GitHub가 4~6시간에 한 번꼴로만 돌려 예비가 안 됐다. 그래서 작업 하나가 ~5시간 45분 동안 깨어 있으면서
# 매시 36분(·50분 재시도)에 Vercel 측정(/api/ping-monitor/cron, TCP만)을 부르고, 끝날 때 자기 자신을 다시 실행한다.
# Vercel 쪽은 측정 서버(Oracle)가 이미 쓴 시는 읽기 1번으로 건너뛴다 — 서버가 살아 있으면 아무것도 안 쓴다.
# 공개 저장소라 GitHub 실행 시간은 무료. 끊겨도 아래 예약(3시간마다)이 다시 살린다(같은 묶음은 하나만 돈다).
# ⚠️ 공개 저장소라 실행 기록이 누구에게나 보인다 — 경쟁점 이름·값은 찍지 않는다.
name: ping-monitor-loop

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

concurrency:
  group: ping-monitor-loop
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: 매시 36·50분 측정 요청 (약 5시간 45분)
        run: |
          end=$(( $(date +%s) + 345*60 ))
          call() {
            token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=isens-ping-monitor" | jq -r '.value')
            code=$(curl -sS -o body.json -w "%{http_code}" --max-time 290 \
              -H "Authorization: Bearer ${token}" "https://my-next-firebase-app-one.vercel.app/api/ping-monitor/cron" || echo 000)
            echo "$(date -u +%FT%TZ) HTTP ${code} · 매장 $(jq '.stores | length' body.json 2>/dev/null || echo '?')곳 $(jq -r '.skipped // .error // empty' body.json 2>/dev/null)"
            test "$code" = "200"
          }
          while :; do
            now=$(date +%s); m=$(( (now / 60) % 60 ))
            if [ "$m" -lt 36 ]; then wait=$(( (36 - m) * 60 )); else wait=$(( (96 - m) * 60 )); fi
            [ $(( now + wait + 20*60 )) -gt "$end" ] && break
            sleep "$wait"
            call || { sleep 840; call || true; }
          done
      - name: 다음 묶음 실행
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ping-monitor-loop.yml --ref main -R "${{ github.repository }}"
