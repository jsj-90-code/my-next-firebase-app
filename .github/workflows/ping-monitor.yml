# 경쟁점 가동률 측정기 1시간 알람(2026-10-06). Vercel 예약 실행은 하루 1번뿐이라 여기서 매시 깨운다.
# 실제 측정·저장은 Vercel 서울 서버(/api/ping-monitor/cron)가 한다. 이 파일은 부르기만 한다.
# 필요한 저장소 비밀값: PING_MONITOR_SECRET(Vercel 환경변수와 같은 값), PING_MONITOR_URL(예: https://<배포 주소>/api/ping-monitor/cron)
# ⚠️ GitHub 예약 실행은 몇~십몇 분 늦게 도는 일이 흔하다. 기록은 "도착한 시각의 한국 시"로 묶이고 같은 시에 두 번 와도 한 번만 센다.
name: ping-monitor

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 측정 요청
        env:
          PING_MONITOR_SECRET: ${{ secrets.PING_MONITOR_SECRET }}
          PING_MONITOR_URL: ${{ secrets.PING_MONITOR_URL }}
        run: |
          code=$(curl -sS -o body.json -w "%{http_code}" --max-time 290 \
            -H "Authorization: Bearer ${PING_MONITOR_SECRET}" "${PING_MONITOR_URL}")
          # 공개 저장소라 실행 기록이 누구에게나 보인다 — 경쟁점 이름·값은 찍지 않고 개수만 찍는다.
          echo "HTTP ${code} · 측정 매장 $(jq '.stores | length' body.json 2>/dev/null || echo '?')곳"
          test "$code" = "200"
